<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }
    
    .app-container { max-width: 600px; margin: 0 auto; }
    
    .app-header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }
    
    .app-header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #00d4ff, #ff00ea, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 3s ease infinite;
    }
    
    @keyframes gradient {
      0%, 100% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
    }
    
    .app-header p { color: #aaa; font-size: 14px; }
    
    .status-bar {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 13px;
      color: #00ff88;
    }
    
    .media-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .media-card h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #00d4ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 15px;
      resize: vertical;
      transition: border-color 0.3s;
    }
    
    .input-field:focus {
      outline: none;
      border-color: #00d4ff;
    }
    
    .model-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 15px;
      cursor: pointer;
    }
    
    .model-select:focus { outline: none; border-color: #00d4ff; }
    
    .action-btn {
      background: linear-gradient(45deg, #00d4ff, #0066ff);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }
    
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4); }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
    
    .loading {
      display: none;
      text-align: center;
      padding: 30px;
      color: #00d4ff;
    }
    
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #00d4ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .error-box {
      background: rgba(255, 0, 0, 0.1);
      border-right: 4px solid #ff4444;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      color: #ffaaaa;
      line-height: 1.6;
    }
    
    .result-box {
      background: rgba(0, 255, 136, 0.1);
      border-right: 4px solid #00ff88;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      color: #00ff88;
      white-space: pre-wrap;
      line-height: 1.8;
    }
    
    .result-box strong { color: #00d4ff; font-size: 16px; }
    
    .copy-btn {
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid #00d4ff;
      color: #00d4ff;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }
    
    .copy-btn:hover { background: rgba(0, 212, 255, 0.3); }
    
    .info-box {
      background: rgba(255, 193, 7, 0.1);
      border-right: 4px solid #ffc107;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
      color: #ffc107;
      line-height: 1.6;
    }
    
    .info-box a { color: #00d4ff; text-decoration: none; }
    .info-box a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1> AI Studio Pro</h1>
      <p>Powered by Hugging Face • Free & Open Source</p>
    </header>

    <div class="status-bar" id="statusBar">
      ✅ Ready to generate • Token: Connected
    </div>

    <article class="media-card">
      <h2>✍️ AI Chat</h2>
      
      <select id="modelSelect" class="model-select">
        <option value="HuggingFaceH4/zephyr-7b-beta">Zephyr 7B (Best Quality)</option>
        <option value="mistralai/Mistral-7B-Instruct-v0.3">Mistral 7B (Smart)</option>
        <option value="meta-llama/Llama-3.2-3B-Instruct">Llama 3.2 (Meta)</option>
        <option value="microsoft/Phi-3-mini-4k-instruct">Phi-3 Mini (Microsoft)</option>
      </select>
      
      <textarea id="promptInput" class="input-field" rows="4" placeholder="Ask anything... Example: Write a short story about a brave robot who saves the world"></textarea>
      
      <button class="action-btn" id="generateBtn" onclick="callAIAPI()">🚀 Generate with AI</button>
      
      <div id="loadingArea" class="loading">
        <div class="spinner"></div>
        <p><strong>Processing...</strong><br><small id="loadingText">Initializing model (first time may take 30-60 seconds)</small></p>
      </div>

      <div id="errorArea" class="error-box"></div>
      <div id="infoArea" class="info-box"></div>
      
      <div id="resultArea" class="result-box">
        <strong>✨ AI Response:</strong><br><br>
        <span id="responseText"></span>
        <br>
        <button class="copy-btn" onclick="copyResponse()">📋 Copy Response</button>
      </div>
    </article>
  </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const HF_TOKEN = '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';
    const HF_API_URL = 'https://api-inference.huggingface.co/models/';
    
    // Model license acceptance URLs
    const LICENSE_URLS = {
      'HuggingFaceH4/zephyr-7b-beta': 'https://huggingface.co/HuggingFaceH4/zephyr-7b-beta',
      'mistralai/Mistral-7B-Instruct-v0.3': 'https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3',
      'meta-llama/Llama-3.2-3B-Instruct': 'https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct',
      'microsoft/Phi-3-mini-4k-instruct': 'https://huggingface.co/microsoft/Phi-3-mini-4k-instruct'
    };

    // ============================================
    // MAIN FUNCTION
    // ============================================
    async function callAIAPI() {
      const prompt = document.getElementById('promptInput').value.trim();
      const model = document.getElementById('modelSelect').value;
      const btn = document.getElementById('generateBtn');
      const loading = document.getElementById('loadingArea');
      const loadingText = document.getElementById('loadingText');
      const errorArea = document.getElementById('errorArea');
      const infoArea = document.getElementById('infoArea');
      const resultArea = document.getElementById('resultArea');
      const responseText = document.getElementById('responseText');
      const statusBar = document.getElementById('statusBar');

      // Validation
      if (HF_TOKEN === '' || HF_TOKEN.length < 10) {
        showError('❌ Invalid API Token. Please check your Hugging Face token.');
        return;
      }

      if (prompt === "") {
        showError('❌ Please enter a prompt first!');
        return;
      }

      // Reset UI
      btn.disabled = true;
      btn.innerText = " Processing...";
      loading.style.display = "block";
      errorArea.style.display = "none";
      infoArea.style.display = "none";
      resultArea.style.display = "none";
      statusBar.innerText = "⏳ Sending request to " + model + "...";

      // Retry logic (max 3 attempts)
      let attempts = 0;
      const maxAttempts = 3;
      let success = false;

      while (attempts < maxAttempts && !success) {
        attempts++;
        loadingText.innerText = `Attempt ${attempts}/${maxAttempts} • Loading model...`;

        try {
          const fullUrl = HF_API_URL + model;
          
          const response = await fetch(fullUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + HF_TOKEN
            },
            body: JSON.stringify({
              inputs: prompt,
              parameters: {
                max_new_tokens: 300,
                temperature: 0.7,
                return_full_text: false,
                do_sample: true,
                top_p: 0.95
              }
            })
          });

          // Handle different error codes
          if (response.status === 403) {
            showLicenseInfo(model);
            throw new Error('403: License required. Please accept the model license.');
          }
          
          if (response.status === 503) {
            if (attempts < maxAttempts) {
              loadingText.innerText = `Model is loading... Waiting 10 seconds (attempt ${attempts}/${maxAttempts})`;
              await sleep(10000); // Wait 10 seconds before retry
              continue;
            } else {
              throw new Error('503: Model is still loading. Please try again in 1-2 minutes.');
            }
          }

          if (response.status === 429) {
            throw new Error('429: Rate limit exceeded. Please wait 1 minute and try again.');
          }

          if (response.status === 401) {
            throw new Error('401: Invalid API token. Please check your Hugging Face token.');
          }

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 200)}`);
          }

          // Success
          const data = await response.json();
          success = true;

          // Parse response
          let aiText = '';
          if (Array.isArray(data) && data[0] && data[0].generated_text) {
            aiText = data[0].generated_text.trim();
          } else if (data.generated_text) {
            aiText = data.generated_text.trim();
          } else {
            aiText = JSON.stringify(data, null, 2);
          }

          // Display result
          loading.style.display = "none";
          btn.disabled = false;
          btn.innerText = " Generate with AI";
          statusBar.innerText = "✅ Success! Response received.";
          
          resultArea.style.display = "block";
          responseText.innerText = aiText;

          // Auto-scroll to result
          resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        } catch (error) {
          if (attempts >= maxAttempts) {
            loading.style.display = "none";
            btn.disabled = false;
            btn.innerText = "🚀 Generate with AI";
            statusBar.innerText = "❌ Error occurred";
            showError(error.message);
          }
        }
      }
    }

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function showError(message) {
      const errorArea = document.getElementById('errorArea');
      errorArea.style.display = "block";
      errorArea.innerHTML = '<strong>❌ Error:</strong><br>' + message;
    }

    function showLicenseInfo(model) {
      const infoArea = document.getElementById('infoArea');
      const licenseUrl = LICENSE_URLS[model] || 'https://huggingface.co/' + model;
      
      infoArea.style.display = "block";
      infoArea.innerHTML = `
        <strong>⚠️ License Required:</strong><br><br>
        This model requires you to accept its license agreement.<br><br>
        <strong>Steps:</strong><br>
        1. Click the link below<br>
        2. Fill the form (any name/email works)<br>
        3. Click "Agree and access repository"<br>
        4. Come back and try again<br><br>
        <a href="${licenseUrl}" target="_blank"> Accept License for ${model}</a>
      `;
    }

    function copyResponse() {
      const responseText = document.getElementById('responseText').innerText;
      navigator.clipboard.writeText(responseText).then(() => {
        alert('✅ Copied to clipboard!');
      }).catch(() => {
        alert('❌ Failed to copy');
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    console.log('AI Studio Pro initialized');
    console.log('Token length:', HF_TOKEN.length);
  </script>
</body>
</html>
