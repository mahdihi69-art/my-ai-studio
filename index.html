<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دستیار صوتی هوشمند</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --danger: #d63031;
            --danger-light: #ff7675;
            --success: #00b894;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-light: #b2bec3;
            --shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text); 
            min-height: 100vh; 
            padding: 16px; 
            padding-bottom: 120px; 
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 20px;
            animation: slideDown 0.5s ease;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .assistant-avatar {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: float 3s infinite ease-in-out;
            position: relative;
        }
        
        .assistant-avatar.speaking {
            animation: speakPulse 0.5s infinite;
        }
        
        .assistant-avatar.listening {
            animation: listenPulse 1s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes speakPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes listenPulse {
            0%, 100% { box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
            50% { box-shadow: 0 0 0 20px rgba(255,255,255,0.2), 0 15px 35px rgba(0,0,0,0.2); }
        }
        
        .balance-card { 
            background: white;
            color: var(--text);
            padding: 30px 20px; 
            border-radius: 24px; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin-bottom: 25px; 
            position: relative; 
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }
        
        .balance-label { 
            font-size: 14px; 
            color: #666;
            margin-bottom: 8px; 
            letter-spacing: 1px;
        }
        
        .balance-amount { 
            font-size: 36px; 
            font-weight: 800; 
            direction: ltr;
            color: var(--primary);
            margin: 10px 0;
        }
        
        .voice-status {
            background: #f0f0f0;
            padding: 12px 20px; 
            border-radius: 30px; 
            margin-top: 15px;
            font-size: 14px; 
            min-height: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
        }
        
        .voice-status.speaking {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .voice-status.listening {
            background: #fff3e0;
            border-color: #ff9800;
        }
        
        .manual-section { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            margin-bottom: 25px;
            animation: slideUp 0.5s ease;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #666;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #e0e0e0; 
            border-radius: 14px; 
            font-size: 15px; 
            background: #fafafa; 
            transition: all 0.3s;
            direction: rtl;
        }
        
        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: white;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        
        textarea { 
            resize: vertical; 
            min-height: 60px; 
            max-height: 120px;
            font-size: 13px; 
        }
        
        .btn-add { 
            width: 100%; 
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }
        
        .btn-add:active {
            transform: translateY(0);
        }
        
        .mic-wrapper { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 100; 
        }
        
        .mic-btn { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            border: none;
            background: linear-gradient(135deg, var(--danger-light), var(--danger));
            color: white; 
            font-size: 32px; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(214, 48, 49, 0.3);
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        .mic-btn:hover {
            transform: scale(1.05);
        }
        
        .mic-btn.listening { 
            transform: scale(1.1); 
            box-shadow: 0 0 0 20px rgba(255, 118, 117, 0.2), 0 15px 40px rgba(214, 48, 49, 0.4);
            animation: breathe 2s infinite ease-in-out;
        }
        
        .mic-btn.listening::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--danger-light);
            animation: ripple 1.5s infinite;
        }
        
        .history-list { 
            list-style: none;
            margin-top: 20px;
        }
        
        .history-item { 
            background: white; 
            padding: 18px; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            border-right: 4px solid var(--danger-light);
            animation: slideIn 0.4s ease;
            transition: all 0.3s;
        }
        
        .history-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .item-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 6px; 
        }
        
        .item-title { 
            font-weight: bold; 
            font-size: 16px;
            color: var(--text);
        }
        
        .item-price { 
            font-weight: 800; 
            color: var(--danger); 
            direction: ltr;
            background: rgba(214, 48, 49, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
        }
        
        .item-note { 
            font-size: 12px; 
            color: var(--text-light); 
            margin-top: 4px; 
            line-height: 1.5;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
        }
        
        .item-date { 
            font-size: 11px; 
            color: #999; 
            margin-top: 6px;
            direction: ltr;
            text-align: left;
        }
        
        .toast { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-100px);
            background: #2d3436; 
            color: white; 
            padding: 14px 28px; 
            border-radius: 50px;
            font-size: 14px; 
            font-weight: bold; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 300; 
            white-space: nowrap; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast.show { 
            transform: translateX(-50%) translateY(0); 
        }
        
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: #fdcb6e; color: #2d3436; }
        
        @keyframes breathe { 
            0%, 100% { box-shadow: 0 0 0 15px rgba(255, 118, 117, 0.2); } 
            50% { box-shadow: 0 0 0 25px rgba(255, 118, 117, 0.1); } 
        }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 480px) {
            .balance-amount { font-size: 28px; }
            .mic-btn { width: 70px; height: 70px; font-size: 28px; }
            .manual-section { padding: 15px; }
            input, textarea { padding: 12px; font-size: 14px; }
            .assistant-avatar {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎙️ دستیار صوتی هوشمند</h1>
        <p style="font-size: 14px; color: rgba(255,255,255,0.9);">نسخه 3.0 - با قابلیت مکالمه</p>
    </div>
    
    <div class="assistant-avatar" id="assistantAvatar">
        🤖
    </div>

    <div class="balance-card">
        <div class="balance-label">💰 مانده حساب شما</div>
        <div class="balance-amount" id="totalBalance">۰ تومان</div>
        <div class="voice-status" id="voiceStatus">
            <span id="statusIcon">💬</span>
            <span id="statusText">آماده صحبت...</span>
        </div>
    </div>

    <div class="manual-section">
        <h3 style="margin-bottom: 15px; font-size: 16px;">📝 ثبت دستی هزینه</h3>
        <div class="input-group">
            <label for="descInput">عنوان خرید</label>
            <input type="text" id="descInput" placeholder="مثلاً: خرید نان">
        </div>
        <div class="input-group">
            <label for="amountInput">مبلغ (تومان)</label>
            <input type="number" id="amountInput" placeholder="مثلاً: 50000" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="noteInput">توضیحات تکمیلی (اختیاری)</label>
            <textarea id="noteInput" placeholder="توضیحات بیشتر..."></textarea>
        </div>
        <button class="btn-add" onclick="addManualExpense()">
            ➕ ثبت دستی
        </button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="font-size: 16px; color: white;">📋 تاریخچه خریدها</h3>
        <button onclick="clearAll()" style="background: white; border: none; color: #d63031; cursor: pointer; font-size: 12px; padding: 8px 16px; border-radius: 20px;">
            🗑️ پاک کردن همه
        </button>
    </div>
    
    <ul class="history-list" id="historyList"></ul>

    <div class="mic-wrapper">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // --- مدیریت داده‌ها و حالت مکالمه ---
        let expenses = JSON.parse(localStorage.getItem('voiceFinanceDB')) || [];
        let convState = 'IDLE';
        let tempData = {};
        let isProcessing = false;
        let voices = [];

        // تبدیل اعداد فارسی به انگلیسی
        function convertPersianNumbers(str) {
            const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            
            for (let i = 0; i < 10; i++) {
                str = str.replace(new RegExp(persianNumbers[i], 'g'), i);
                str = str.replace(new RegExp(arabicNumbers[i], 'g'), i);
            }
            return str;
        }

        function toPersianNumber(num) {
            return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function saveData() {
            localStorage.setItem('voiceFinanceDB', JSON.stringify(expenses));
            renderUI();
        }

        function addExpense(desc, amount, note = '') {
            if (!desc || isNaN(amount) || amount <= 0) {
                showToast('⚠️ اطلاعات نامعتبر است', 'error');
                return false;
            }
            
            const now = new Date();
            expenses.unshift({ 
                desc, 
                amount, 
                note, 
                date: now.toLocaleDateString('fa-IR'),
                time: now.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'}),
                timestamp: now.getTime()
            });
            saveData();
            showToast('✅ هزینه ثبت شد', 'success');
            return true;
        }

        function renderUI() {
            const total = expenses.reduce((sum, i) => sum + i.amount, 0);
            document.getElementById('totalBalance').innerText = toPersianNumber(total.toLocaleString('fa-IR')) + ' تومان';
            
            const historyList = document.getElementById('historyList');
            
            if (expenses.length === 0) {
                historyList.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: white; background: rgba(255,255,255,0.1); border-radius: 20px;">
                        <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
                        <p style="font-size: 18px; font-weight: bold;">هنوز خریدی ثبت نشده است</p>
                        <p style="font-size: 14px; margin-top: 10px;">از میکروفون یا فرم بالا استفاده کنید</p>
                    </div>
                `;
                return;
            }
            
            historyList.innerHTML = expenses.map((item, index) => `
                <li class="history-item" style="animation-delay: ${index * 0.05}s">
                    <div class="item-header">
                        <span class="item-title">${item.desc}</span>
                        <span class="item-price">${toPersianNumber(item.amount.toLocaleString('fa-IR'))} تومان</span>
                    </div>
                    ${item.note ? `<div class="item-note">📝 ${item.note}</div>` : ''}
                    <div class="item-date">${item.date} - ${item.time}</div>
                </li>
            `).join('');
        }

        // --- سیستم صوتی ---
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('voiceStatus');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const assistantAvatar = document.getElementById('assistantAvatar');
        
        let recognition, isListening = false;
        let synthesis = window.speechSynthesis;
        
        // بارگذاری صداها
        function loadVoices() {
            voices = synthesis.getVoices();
            console.log('Voices loaded:', voices.length);
            
            // نمایش صداهای فارسی
            const persianVoices = voices.filter(v => v.lang.includes('fa') || v.lang.includes('ar'));
            console.log('Persian/Arabic voices:', persianVoices);
        }
        
        if (synthesis) {
            loadVoices();
            synthesis.onvoiceschanged = loadVoices;
        }

        // تابع صحبت کردن بهبود یافته
        function speak(text) {
            if (!synthesis) {
                console.log('Speech synthesis not supported');
                showToast('مرورگر شما از صحبت کردن پشتیبانی نمی‌کند', 'error');
                return;
            }
            
            // توقف گفتار قبلی
            synthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            // انتخاب بهترین صدای فارسی
            const persianVoice = voices.find(v => v.lang.includes('fa'));
            const arabicVoice = voices.find(v => v.lang.includes('ar'));
            
            if (persianVoice) {
                utterance.voice = persianVoice;
                console.log('Using Persian voice:', persianVoice.name);
            } else if (arabicVoice) {
                utterance.voice = arabicVoice;
                console.log('Using Arabic voice:', arabicVoice.name);
            } else {
                console.log('No Persian/Arabic voice found, using default');
            }
            
            // رویدادها
            utterance.onstart = () => {
                console.log('Speaking started:', text);
                assistantAvatar.classList.add('speaking');
                statusEl.classList.add('speaking');
                updateStatus('🔊', 'در حال صحبت...', true);
            };
            
            utterance.onend = () => {
                console.log('Speaking ended');
                assistantAvatar.classList.remove('speaking');
                statusEl.classList.remove('speaking');
                
                if (convState === 'IDLE') {
                    updateStatus('💬', 'آماده صحبت...', true);
                }
            };
            
            utterance.onerror = (e) => {
                console.error('Speech error:', e);
                assistantAvatar.classList.remove('speaking');
                statusEl.classList.remove('speaking');
                
                // تلاش مجدد بدون صدای خاص
                if (utterance.voice) {
                    const retryUtterance = new SpeechSynthesisUtterance(text);
                    retryUtterance.lang = 'fa-IR';
                    retryUtterance.rate = 0.9;
                    synthesis.speak(retryUtterance);
                }
            };
            
            // صحبت کردن
            setTimeout(() => {
                synthesis.speak(utterance);
            }, 100);
        }

        // تابع تست صدا
        function testSpeak() {
            speak('سلام! من دستیار صوتی شما هستم. چطور می‌توانم کمک کنم؟');
        }

        // --- سیستم تشخیص صدا ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRec) {
            recognition = new SpeechRec();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 5;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                assistantAvatar.classList.add('listening');
                statusEl.classList.add('listening');
                updateStatus('👂', 'گوش می‌دهم...', true);
                console.log('Listening started');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        transcript += event.results[i][0].transcript;
                    }
                }
                
                const displayText = finalTranscript || transcript;
                if (displayText) {
                    updateStatus('🗣️', `"${displayText}"`, true);
                }
                
                if (finalTranscript) {
                    console.log('Final transcript:', finalTranscript);
                    processCommand(finalTranscript.trim().toLowerCase());
                }
            };

            recognition.onerror = (e) => {
                console.error('Speech recognition error:', e.error);
                stopListening();
                
                switch(e.error) {
                    case 'not-allowed':
                        showToast('⚠️ دسترسی میکروفون را فعال کنید', 'error');
                        speak('لطفاً دسترسی میکروفون را فعال کنید');
                        break;
                    case 'no-speech':
                        showToast('🔇 صدایی شنیده نشد، دوباره تلاش کنید', 'warning');
                        break;
                    case 'network':
                        showToast('📡 خطای شبکه در تشخیص صدا', 'error');
                        break;
                    default:
                        showToast('⚠️ خطا در تشخیص صدا: ' + e.error, 'error');
                }
            };

            recognition.onend = () => {
                console.log('Listening ended, state:', convState);
                isListening = false;
                micBtn.classList.remove('listening');
                assistantAvatar.classList.remove('listening');
                statusEl.classList.remove('listening');
                
                if (convState !== 'IDLE' && convState !== 'FINISHED') {
                    setTimeout(() => {
                        try { 
                            recognition.start(); 
                            updateStatus('👂', 'منتظر پاسخ شما...', true);
                        } catch(e) {
                            console.log('Recognition restart error:', e);
                        }
                    }, 800);
                }
            };
        } else {
            micBtn.style.display = 'none';
            showToast('مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند', 'error');
        }

        function toggleVoice() {
            if (!recognition) { 
                showToast('مرورگر پشتیبانی نمی‌کند', 'error'); 
                return; 
            }
            
            if (isListening) {
                recognition.stop();
                convState = 'IDLE';
                updateStatus('💬', 'توقف شد', true);
            } else {
                // توقف هر گفتار در حال پخش
                if (synthesis.speaking) {
                    synthesis.cancel();
                }
                
                convState = 'IDLE';
                try {
                    recognition.start();
                } catch(e) {
                    console.log('Recognition start error:', e);
                }
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            assistantAvatar.classList.remove('listening');
            statusEl.classList.remove('listening');
            if (recognition) {
                try {
                    recognition.stop();
                } catch(e) {
                    console.log('Recognition stop error:', e);
                }
            }
        }

        function updateStatus(icon, text, show) {
            statusIcon.innerText = icon;
            statusText.innerText = text;
        }

        // --- مغز متفکر ---
        function processCommand(cmd) {
            if (isProcessing) return;
            
            cmd = convertPersianNumbers(cmd);
            console.log('Processing command:', cmd);
            showToast(`شنیدم: "${cmd}"`, 'success');
            
            // مرحله ۱: پرسیدن نام کالا
            if (convState === 'ASK_DESC') {
                if (cmd.length < 2) {
                    speak("نام کالا را واضح‌تر بگویید");
                    return;
                }
                tempData.desc = cmd;
                speak("چقدر پرداخت کردی؟");
                updateStatus('💬', 'مبلغ را بگویید...', true);
                convState = 'ASK_AMT';
                return;
            }
            
            // مرحله ۲: پرسیدن مبلغ
            if (convState === 'ASK_AMT') {
                const nums = cmd.match(/\d+/g);
                if (nums && nums.length > 0) {
                    let amt = parseInt(nums[nums.length-1]);
                    
                    if (cmd.includes('هزار')) amt *= 1000;
                    if (cmd.includes('میلیون')) amt *= 1000000;
                    if (cmd.includes('تومان') && amt < 100) amt *= 1000;
                    
                    if (amt <= 0 || amt > 1000000000) {
                        speak("مبلغ نامعتبر است. لطفاً دوباره بگویید");
                        return;
                    }
                    
                    tempData.amount = amt;
                    if (addExpense(tempData.desc, amt)) {
                        speak(`${toPersianNumber(amt.toLocaleString('fa-IR'))} تومان ثبت شد. توضیح خاصی داری؟ اگر نداری بگو نه.`);
                        updateStatus('✅', 'ثبت شد. توضیح؟', true);
                        convState = 'ASK_NOTE';
                    } else {
                        convState = 'IDLE';
                    }
                } else {
                    speak("مبلغ را نفهمیدم. لطفاً فقط عدد را بگویید");
                    updateStatus('🔢', 'منتظر عدد...', true);
                }
                return;
            }

            // مرحله ۳: پرسیدن توضیحات
            if (convState === 'ASK_NOTE') {
                if (cmd.includes('نه') || cmd.includes('ندارم') || cmd.includes('خالی') || cmd.length < 3) {
                    speak("بسیار عالی. آماده دستور بعدی هستم.");
                    updateStatus('✅', 'آماده', true);
                } else {
                    expenses[0].note = cmd;
                    saveData();
                    speak("توضیح ذخیره شد. چه کار دیگری می‌خواهید؟");
                    updateStatus('✅', 'توضیح ذخیره شد', true);
                }
                convState = 'IDLE';
                return;
            }

            // دستورات اصلی
            if (cmd.includes('گزارش') || cmd.includes('وضعیت') || cmd.includes('چقدر') || cmd.includes('مانده')) {
                giveDetailedReport();
                convState = 'IDLE';
            } 
            else if (cmd.includes('آخرین') || cmd.includes('جدید') || cmd.includes('اخرین')) {
                if (expenses.length > 0) {
                    const e = expenses[0];
                    let text = `آخرین خرید: ${e.desc}، ${toPersianNumber(e.amount.toLocaleString('fa-IR'))} تومان`;
                    if (e.note) text += `. توضیح: ${e.note}`;
                    speak(text);
                } else {
                    speak("هنوز خریدی ثبت نشده است.");
                }
                convState = 'IDLE';
            }
            else if (cmd.includes('ثبت') || cmd.includes('خرید') || cmd.includes('هزینه') || cmd.includes('اضافه')) {
                const nums = cmd.match(/\d+/g);
                if (nums && nums.length > 0) {
                    let amt = parseInt(nums[nums.length-1]);
                    if (cmd.includes('هزار')) amt *= 1000;
                    if (cmd.includes('میلیون')) amt *= 1000000;
                    
                    let desc = cmd
                        .replace(/[0-9۰-۹]/g, '')
                        .replace(/هزار|میلیون|تومان|ریال|ثبت|کردم|خرید|هزینه|اضافه/g, '')
                        .trim() || "خرید";
                    
                    if (addExpense(desc, amt)) {
                        speak(`${toPersianNumber(amt.toLocaleString('fa-IR'))} تومان بابت ${desc} ثبت شد.`);
                    }
                    convState = 'IDLE';
                } else {
                    speak("چی خریدی؟");
                    updateStatus('💬', 'چی خریدی؟', true);
                    convState = 'ASK_DESC';
                }
            }
            else if (cmd.includes('پاک') || cmd.includes('حذف') || cmd.includes('clear')) {
                clearAll();
                convState = 'IDLE';
            }
            else if (cmd.includes('سلام') || cmd.includes('درود') || cmd.includes('hello') || cmd.includes('hi')) {
                speak("سلام! من دستیار صوتی شما هستم. می‌توانید بگویید ثبت هزینه، گزارش، یا آخرین خرید.");
                convState = 'IDLE';
            }
            else if (cmd.includes('راهنما') || cmd.includes('کمک') || cmd.includes('help')) {
                speak("می‌توانید بگویید: ثبت هزینه، گزارش، آخرین خرید، یا پاک کردن همه. همچنین می‌توانید سلام کنید.");
                convState = 'IDLE';
            }
            else if (cmd.includes('تست') || cmd.includes('آزمایش')) {
                speak("سیستم صوتی به درستی کار می‌کند.");
                convState = 'IDLE';
            }
            else {
                speak("متوجه نشدم. می‌توانید بگویید: ثبت هزینه، گزارش، آخرین خرید، یا راهنما.");
                convState = 'IDLE';
            }
        }

        function giveDetailedReport() {
            if (expenses.length === 0) { 
                speak("هیچ خریدی ثبت نشده است."); 
                return; 
            }
            
            const todayStr = new Date().toLocaleDateString('fa-IR');
            const todayExp = expenses.filter(i => i.date === todayStr);
            
            if (todayExp.length === 0) { 
                speak("امروز خرجی نداشتید."); 
                return; 
            }
            
            const total = todayExp.reduce((s,i) => s+i.amount, 0);
            let report = `امروز ${toPersianNumber(todayExp.length)} خرید ثبت شده. جمع کل: ${toPersianNumber(total.toLocaleString('fa-IR'))} تومان. `;
            
            todayExp.slice(0, 5).forEach((e, idx) => {
                report += `${toPersianNumber(idx+1)}. ${e.desc} ${toPersianNumber(e.amount.toLocaleString('fa-IR'))} تومان`;
                if (e.note) report += ` - ${e.note}`;
                report += '. ';
            });
            
            if (todayExp.length > 5) {
                report += `و ${toPersianNumber(todayExp.length - 5)} مورد دیگر.`;
            }
            
            speak(report);
        }

        function addManualExpense() {
            const d = document.getElementById('descInput').value.trim();
            const a = parseInt(document.getElementById('amountInput').value);
            const n = document.getElementById('noteInput').value.trim();
            
            if(addExpense(d, a, n)) {
                document.getElementById('descInput').value = '';
                document.getElementById('amountInput').value = '';
                document.getElementById('noteInput').value = '';
                speak("ثبت دستی انجام شد.");
            } else {
                showToast('⚠️ لطفاً عنوان و مبلغ معتبر وارد کنید', 'error');
            }
        }

        function clearAll() {
            if (expenses.length === 0) {
                showToast('📭 لیست خالی است', 'warning');
                speak("لیست خالی است.");
                return;
            }
            
            if(confirm("همه داده‌ها پاک شوند؟")) {
                expenses = []; 
                saveData(); 
                speak("همه چیز پاک شد.");
                showToast('🗑️ همه داده‌ها پاک شد', 'warning');
            }
        }

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast';
            
            switch(type) {
                case 'success':
                    t.classList.add('success');
                    break;
                case 'error':
                    t.classList.add('error');
                    break;
                case 'warning':
                    t.classList.add('warning');
                    break;
            }
            
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // راه‌اندازی اولیه
        renderUI();
        
        // تست صدا در ابتدا
        setTimeout(() => {
            console.log('Testing speech...');
            testSpeak();
        }, 2000);
    </script>
</body>
</html>
