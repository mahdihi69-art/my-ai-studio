<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Studio">
  <title>AI Studio - آفلاین</title>
  <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQUkgU3R1ZGlvIiwic2hvcnRfbmFtZSI6IkFJIFN0dWRpbyIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGYwYzI5IiwidGhlbWVfY29sb3IiOiIjMDBkNGZmIiwiaWNvbnMiOlt7InNyYyI6ImRhdGE6aW1hZ2Uvc3ZnK3htbDtiYXNlNjQsUEhOMlp5QjNhV1IwYUQwaU1qQXdJaUJvWldsbmFIUTlJalV3SWlCb1pXbG5hSFE5SWpVd0lpQm1hV3hzUFNJak1EQXdJaUIwY21GdWMyRmpkR2x2YmkxcFpHVnVkR2wwZVQwaU1qQXdJaUJtYVd4c1BTSWpNREF3SWlCMGJ5QnBjeUJ6YjJOclpYUnpMbU52YlE9PSIsInNpemVzIjoiMTkyeDE5MiIsInR5cGUiOiJpbWFnZS9zdmcreG1sIn1dfQ==">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, 'Segoe UI', sans-serif; }
    body { 
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); 
      color: #ffffff; 
      min-height: 100vh; 
      padding: 20px; 
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; font-size: 26px; }
    .subtitle { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 30px; }
    
    .card { 
      background: rgba(255,255,255,0.05); 
      backdrop-filter: blur(10px);
      padding: 25px; 
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    
    textarea { 
      width: 100%; 
      background: rgba(0,0,0,0.4); 
      border: 2px solid rgba(255,255,255,0.2); 
      color: white; 
      padding: 15px; 
      border-radius: 12px; 
      font-size: 15px; 
      margin-bottom: 15px; 
      resize: vertical; 
      min-height: 120px; 
    }
    textarea:focus { outline: none; border-color: #00d4ff; }
    
    button { 
      background: linear-gradient(45deg, #00d4ff, #0066ff); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 12px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      width: 100%; 
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #555; cursor: not-allowed; }
    
    .status-box { 
      text-align: center; 
      padding: 15px; 
      background: rgba(255,193,7,0.1); 
      border-radius: 12px; 
      margin-bottom: 20px; 
      color: #ffc107; 
      font-size: 14px; 
      line-height: 1.6;
    }
    .status-box.ready { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid #00ff88; }
    .status-box.error { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid #ff4444; }
    
    .loading { display: none; text-align: center; padding: 30px; color: #00d4ff; }
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); 
      border-left-color: #00d4ff; 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite; 
      margin: 0 auto 15px; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .result { 
      display: none; 
      background: rgba(0,255,136,0.1); 
      border-right: 4px solid #00ff88; 
      padding: 20px; 
      border-radius: 12px; 
      margin-top: 20px; 
      line-height: 1.8; 
      font-size: 15px;
      white-space: pre-wrap;
    }
    
    .install-btn {
      display: none;
      background: linear-gradient(45deg, #00ff88, #00cc6a);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 استودیو هوش مصنوعی</h1>
    <p class="subtitle">نسخه آفلاین و امن (بدون نیاز به اینترنت پس از دانلود)</p>
    
    <div class="status-box" id="status">
      ⏳ در حال آماده‌سازی موتور هوش مصنوعی...<br>
      <small>(لطفاً صبر کنید، مدل در حال دانلود است)</small>
    </div>
    
    <div class="card">
      <textarea id="prompt" placeholder="سوال خود را اینجا بنویسید...&#10;&#10;مثال: یک داستان کوتاه درباره یک ربات شجاع بنویس."></textarea>
      <button id="btn" onclick="generate()" disabled> در حال بارگذاری...</button>
      <button class="install-btn" id="installBtn" onclick="installApp()">📱 نصب اپلیکیشن روی گوشی</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>هوش مصنوعی در حال فکر کردن است...</p>
      </div>
      
      <div class="result" id="result"></div>
    </div>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let deferredPrompt = null;

    // PWA Install
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    window.installApp = async function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          alert('✅ اپلیکیشن نصب شد!');
        }
        deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      } else {
        alert('برای نصب: منوی مرورگر → Add to Home Screen');
      }
    };

    async function init() {
      const statusBox = document.getElementById('status');
      const btn = document.getElementById('btn');
      
      try {
        const model = "Qwen1.5-0.5B-Chat-q4f16_1-MLC";
        
        engine = await CreateMLCEngine(model, {
          initProgressCallback: (progress) => {
            statusBox.innerHTML = `⏳ ${progress.text}<br><small>لطفاً صفحه را نبندید</small>`;
          }
        });
        
        statusBox.className = "status-box ready";
        statusBox.innerHTML = "✅ هوش مصنوعی آماده است!<br><small>اکنون می‌توانید سوال بپرسید.</small>";
        btn.disabled = false;
        btn.innerHTML = "🚀 ارسال به هوش مصنوعی";
      } catch (err) {
        statusBox.className = "status-box error";
        statusBox.innerHTML = "❌ خطا در بارگذاری:<br>" + err.message + "<br><small>لطفاً اتصال اینترنت خود را بررسی کرده و صفحه را رفرش کنید.</small>";
      }
    }

    window.generate = async function() {
      const promptText = document.getElementById('prompt').value.trim();
      if (!promptText) {
        alert('لطفاً ابتدا متنی بنویسید!');
        return;
      }

      const btn = document.getElementById('btn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      btn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      try {
        const reply = await engine.chat.completions.create({
          messages: [
            { role: "system", content: "You are a helpful assistant. Answer in Persian if the user asks in Persian." },
            { role: "user", content: promptText }
          ],
          temperature: 0.7,
          max_tokens: 500
        });

        loading.style.display = 'none';
        btn.disabled = false;
        result.style.display = 'block';
        result.innerHTML = '<strong>✨ پاسخ:</strong><br><br>' + reply.choices[0].message.content;
        
      } catch (err) {
        loading.style.display = 'none';
        btn.disabled = false;
        alert('خطا در تولید پاسخ: ' + err.message);
      }
    };

    init();
  </script>
</body>
</html>
