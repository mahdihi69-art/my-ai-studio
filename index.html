<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوش مصنوعی صوتی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        
        body { 
            background: #1a1a2e; 
            color: white; 
            min-height: 100vh; 
            padding: 20px; 
            padding-bottom: 120px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        
        .assistant-avatar {
            width: 100px;
            height: 100px;
            margin: 20px auto;
            border-radius: 50%;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            transition: all 0.3s;
        }
        
        .assistant-avatar.speaking { animation: pulse 0.5s infinite; background: #00b894; }
        .assistant-avatar.listening { animation: pulse 1s infinite; background: #ff7675; }
        .assistant-avatar.thinking { animation: pulse 0.3s infinite; background: #fdcb6e; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .balance-card {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .balance-amount { font-size: 30px; color: #00b894; margin: 10px 0; }
        
        .status-box {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
        }
        
        .chat-box {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .chat-message {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .chat-message.user { background: #0f3460; text-align: right; }
        .chat-message.assistant { background: #1a1a2e; border: 1px solid #00b894; color: #00b894; }
        
        .manual-section {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .btn-add {
            width: 100%;
            background: #00b894;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .mic-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: #ff7675;
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mic-btn.listening {
            background: #d63031;
            box-shadow: 0 0 0 20px rgba(255, 118, 117, 0.3);
        }
        
        .history-list { list-style: none; margin-top: 20px; }
        
        .history-item {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 4px solid #ff7675;
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .item-title { font-weight: bold; }
        .item-price { color: #ff7675; }
        
        .item-date {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            direction: ltr;
            text-align: left;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #00b894;
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            transition: 0.3s;
            z-index: 300;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #d63031; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 دستیار هوش مصنوعی صوتی</h1>
        <p style="color: #888; font-size: 12px;">نسخه هوشمند با DeepSeek</p>
    </div>
    
    <div class="assistant-avatar" id="assistantAvatar">🤖</div>

    <div class="balance-card">
        <div>💰 موجودی حساب</div>
        <div class="balance-amount" id="totalBalance">۰ تومان</div>
        <div class="status-box" id="statusBox">برای شروع روی میکروفون کلیک کنید</div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="manual-section">
        <h3 style="margin-bottom: 15px;">📝 ثبت دستی</h3>
        <input type="text" id="descInput" placeholder="عنوان خرید">
        <input type="number" id="amountInput" placeholder="مبلغ (تومان)">
        <textarea id="noteInput" placeholder="توضیحات (اختیاری)" rows="2"></textarea>
        <button class="btn-add" onclick="addManualExpense()">➕ ثبت</button>
    </div>

    <h3 style="margin: 20px 0;">📋 تاریخچه</h3>
    <ul class="history-list" id="historyList"></ul>

    <div class="mic-wrapper">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // تنظیمات DeepSeek API
        const DEEPSEEK_API_KEY = 'sk-XXXXXXXXXXXXXXXXXXXX'; // API key خودت رو اینجا بذار
        const DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';
        
        let expenses = JSON.parse(localStorage.getItem('voiceFinanceDB')) || [];
        let recognition = null;
        let isListening = false;
        let conversationHistory = [];
        
        function convertNumbers(str) {
            const persian = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            const arabic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            for(let i=0; i<10; i++) {
                str = str.replace(new RegExp(persian[i], 'g'), i);
                str = str.replace(new RegExp(arabic[i], 'g'), i);
            }
            return str;
        }
        
        function toPersian(num) {
            return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }
        
        function addExpense(desc, amount, note = '') {
            if (!desc || isNaN(amount) || amount <= 0) return false;
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('fa-IR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const timeStr = now.toLocaleTimeString('fa-IR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            expenses.unshift({
                desc: desc,
                amount: amount,
                note: note,
                date: dateStr,
                time: timeStr,
                timestamp: now.getTime()
            });
            
            localStorage.setItem('voiceFinanceDB', JSON.stringify(expenses));
            renderUI();
            return true;
        }
        
        function renderUI() {
            const total = expenses.reduce((sum, i) => sum + i.amount, 0);
            document.getElementById('totalBalance').innerText = toPersian(total.toLocaleString('fa-IR')) + ' تومان';
            
            const list = document.getElementById('historyList');
            if (expenses.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">هنوز خریدی ثبت نشده</div>';
                return;
            }
            
            list.innerHTML = expenses.map(item => `
                <li class="history-item">
                    <div class="item-header">
                        <span class="item-title">${item.desc}</span>
                        <span class="item-price">${toPersian(item.amount.toLocaleString('fa-IR'))} تومان</span>
                    </div>
                    ${item.note ? '<div style="color:#999;font-size:12px;margin-top:5px;">📝 ' + item.note + '</div>' : ''}
                    <div class="item-date">📅 ${item.date} - 🕐 ${item.time}</div>
                </li>
            `).join('');
        }
        
        function addChatMessage(text, isUser = false) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message ' + (isUser ? 'user' : 'assistant');
            msgDiv.innerText = (isUser ? '👤 ' : '🤖 ') + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // تابع صحبت کردن
        function speak(text) {
            console.log('Speaking:', text);
            addChatMessage(text, false);
            document.getElementById('statusBox').innerText = text;
            
            document.getElementById('assistantAvatar').classList.add('speaking');
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                
                const voices = window.speechSynthesis.getVoices();
                const faVoice = voices.find(v => v.lang.includes('fa'));
                const arVoice = voices.find(v => v.lang.includes('ar'));
                
                if (faVoice) {
                    utterance.voice = faVoice;
                } else if (arVoice) {
                    utterance.voice = arVoice;
                }
                
                utterance.onend = () => {
                    document.getElementById('assistantAvatar').classList.remove('speaking');
                    if (conversationHistory.length === 0) {
                        document.getElementById('statusBox').innerText = 'آماده دستور جدید';
                    }
                };
                
                utterance.onerror = (e) => {
                    console.log('Speech error:', e);
                    document.getElementById('assistantAvatar').classList.remove('speaking');
                    
                    setTimeout(() => {
                        const retry = new SpeechSynthesisUtterance(text);
                        retry.lang = 'fa-IR';
                        retry.rate = 0.9;
                        window.speechSynthesis.speak(retry);
                    }, 500);
                };
                
                setTimeout(() => {
                    window.speechSynthesis.speak(utterance);
                }, 100);
            }
        }
        
        // ارتباط با DeepSeek
        async function askDeepSeek(userMessage) {
            document.getElementById('assistantAvatar').classList.add('thinking');
            document.getElementById('statusBox').innerText = '🤔 در حال فکر کردن...';
            
            // ساخت context از داده‌های مالی
            const expensesContext = expenses.slice(0, 10).map(e => 
                `${e.desc}: ${e.amount} تومان (${e.date})`
            ).join('\n');
            
            const systemPrompt = `تو یک دستیار مالی هوشمند فارسی زبان هستی. 
            وظایف تو:
            1. ثبت هزینه‌ها (تشخیص مبلغ و عنوان از صحبت کاربر)
            2. گزارش‌دهی مالی
            3. پاسخ به سوالات مالی
            4. محاسبه جمع هزینه‌ها
            
            داده‌های فعلی کاربر:
            ${expensesContext || 'هنوز هزینه‌ای ثبت نشده'}
            
            اگر کاربر خواست هزینه ثبت کنی، مبلغ و عنوان را تشخیص بده و بگو ثبت شد.
            همیشه فارسی و مختصر جواب بده.`;
            
            try {
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...conversationHistory.slice(-5),
                            { role: 'user', content: userMessage }
                        ],
                        temperature: 0.7,
                        max_tokens: 150
                    })
                });
                
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                conversationHistory.push(
                    { role: 'user', content: userMessage },
                    { role: 'assistant', content: aiResponse }
                );
                
                document.getElementById('assistantAvatar').classList.remove('thinking');
                return aiResponse;
                
            } catch (error) {
                console.error('DeepSeek error:', error);
                document.getElementById('assistantAvatar').classList.remove('thinking');
                
                // اگر DeepSeek در دسترس نبود، پاسخ محلی بده
                return handleLocalCommand(userMessage);
            }
        }
        
        // پردازش محلی (fallback)
        function handleLocalCommand(cmd) {
            cmd = convertNumbers(cmd);
            
            if (cmd.includes('گزارش') || cmd.includes('وضعیت')) {
                if (expenses.length === 0) return 'خریدی ثبت نشده';
                const total = expenses.reduce((sum, i) => sum + i.amount, 0);
                return 'جمع کل: ' + toPersian(total.toLocaleString('fa-IR')) + ' تومان';
            }
            
            if (cmd.includes('ثبت') || cmd.includes('خرید')) {
                const nums = cmd.match(/\d+/g);
                if (nums) {
                    let amount = parseInt(nums[nums.length-1]);
                    if (cmd.includes('هزار')) amount *= 1000;
                    let desc = cmd.replace(/[0-9۰-۹]/g, '').replace(/هزار|میلیون|تومان|ثبت|خرید|هزینه/g, '').trim() || 'خرید';
                    addExpense(desc, amount);
                    return toPersian(amount.toLocaleString('fa-IR')) + ' تومان بابت ' + desc + ' ثبت شد';
                }
            }
            
            return 'متوجه نشدم. لطفاً واضح‌تر بگویید';
        }
        
        // پردازش دستور با DeepSeek
        async function processCommand(cmd) {
            cmd = convertNumbers(cmd);
            console.log('Processing:', cmd);
            
            addChatMessage(cmd, true);
            
            // اول سعی کن دستور محلی رو تشخیص بدی
            if (cmd.includes('ثبت') || cmd.includes('خرید') || cmd.includes('هزینه')) {
                const nums = cmd.match(/\d+/g);
                if (nums && nums.length > 0) {
                    let amount = parseInt(nums[nums.length-1]);
                    if (cmd.includes('هزار')) amount *= 1000;
                    if (cmd.includes('میلیون')) amount *= 1000000;
                    
                    let desc = cmd.replace(/[0-9۰-۹]/g, '')
                        .replace(/هزار|میلیون|تومان|ثبت|خرید|هزینه/g, '')
                        .trim() || 'خرید';
                    
                    if (addExpense(desc, amount)) {
                        const response = toPersian(amount.toLocaleString('fa-IR')) + ' تومان بابت ' + desc + ' ثبت شد';
                        speak(response);
                        return;
                    }
                }
            }
            
            // برای بقیه موارد از DeepSeek استفاده کن
            const aiResponse = await askDeepSeek(cmd);
            speak(aiResponse);
        }
        
        // تنظیم تشخیص صدا
        function setupRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRec) {
                showToast('مرورگر پشتیبانی نمی‌کند', 'error');
                return;
            }
            
            recognition = new SpeechRec();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('assistantAvatar').classList.add('listening');
                document.getElementById('statusBox').innerText = '👂 گوش می‌دهم...';
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log('Heard:', transcript);
                processCommand(transcript.trim());
            };
            
            recognition.onerror = (event) => {
                console.log('Error:', event.error);
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('assistantAvatar').classList.remove('listening');
                
                if (event.error === 'not-allowed') {
                    showToast('دسترسی میکروفون را فعال کنید', 'error');
                } else if (event.error === 'no-speech') {
                    showToast('صدایی شنیده نشد', 'error');
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('assistantAvatar').classList.remove('listening');
            };
        }
        
        function toggleVoice() {
            if (!recognition) setupRecognition();
            
            if (isListening) {
                recognition.stop();
                document.getElementById('statusBox').innerText = 'توقف شد';
            } else {
                window.speechSynthesis.cancel();
                try {
                    recognition.start();
                } catch(e) {}
            }
        }
        
        function addManualExpense() {
            const desc = document.getElementById('descInput').value.trim();
            const amount = parseInt(document.getElementById('amountInput').value);
            const note = document.getElementById('noteInput').value.trim();
            
            if (addExpense(desc, amount, note)) {
                document.getElementById('descInput').value = '';
                document.getElementById('amountInput').value = '';
                document.getElementById('noteInput').value = '';
                speak('ثبت شد');
                showToast('✅ ثبت شد');
            } else {
                showToast('اطلاعات ناقص است', 'error');
            }
        }
        
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // راه‌اندازی
        renderUI();
        setupRecognition();
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }
        
        // تست صدا
        setTimeout(() => {
            speak('سلام! من دستیار هوش مصنوعی شما هستم');
        }, 1000);
    </script>
</body>
</html>
