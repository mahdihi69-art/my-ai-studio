<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دستیار صوتی هوشمند</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Tahoma, 'Segoe UI', sans-serif; 
        }
        
        body { 
            background: #1a1a2e;
            color: white; 
            min-height: 100vh; 
            padding: 20px; 
            padding-bottom: 120px; 
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .assistant-avatar {
            width: 100px;
            height: 100px;
            margin: 20px auto;
            border-radius: 50%;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        
        .assistant-avatar.speaking {
            animation: pulse 0.5s infinite;
            box-shadow: 0 0 30px #00b894;
        }
        
        .assistant-avatar.listening {
            animation: pulse 1s infinite;
            box-shadow: 0 0 30px #ff7675;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .balance-card { 
            background: #16213e;
            padding: 25px; 
            border-radius: 20px; 
            text-align: center; 
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        
        .balance-amount { 
            font-size: 32px; 
            font-weight: bold; 
            color: #00b894;
            margin: 10px 0;
        }
        
        .status-box {
            background: #0f3460;
            padding: 15px; 
            border-radius: 15px; 
            margin-top: 15px;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
        }
        
        .chat-box {
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #0f3460;
        }
        
        .chat-message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .chat-message.user {
            background: #0f3460;
            text-align: right;
            color: #fff;
        }
        
        .chat-message.assistant {
            background: #1a1a2e;
            text-align: left;
            color: #00b894;
            border: 1px solid #00b894;
        }
        
        .manual-section { 
            background: #16213e;
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #0f3460; 
            border-radius: 10px; 
            font-size: 14px; 
            background: #1a1a2e;
            color: white;
            margin-bottom: 10px;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00b894;
        }
        
        .btn-add { 
            width: 100%; 
            background: #00b894;
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer;
        }
        
        .btn-add:hover {
            background: #00a381;
        }
        
        .mic-wrapper { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 100; 
        }
        
        .mic-btn { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            border: none;
            background: #ff7675;
            color: white; 
            font-size: 32px; 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 118, 117, 0.5);
            transition: all 0.3s;
        }
        
        .mic-btn.listening { 
            background: #d63031;
            box-shadow: 0 0 0 20px rgba(255, 118, 117, 0.2);
            animation: pulse 1s infinite;
        }
        
        .history-list { 
            list-style: none;
            margin-top: 20px;
        }
        
        .history-item { 
            background: #16213e;
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            border-right: 4px solid #ff7675;
        }
        
        .item-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 5px; 
        }
        
        .item-title { 
            font-weight: bold; 
            font-size: 16px;
            color: white;
        }
        
        .item-price { 
            font-weight: bold; 
            color: #ff7675;
            direction: ltr;
        }
        
        .toast { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-100px);
            background: #00b894; 
            color: white; 
            padding: 15px 25px; 
            border-radius: 25px;
            font-size: 14px; 
            font-weight: bold; 
            transition: 0.3s;
            z-index: 300;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show { 
            transform: translateX(-50%) translateY(0); 
        }
        
        .toast.error { background: #d63031; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎙️ دستیار صوتی هوشمند</h1>
    </div>
    
    <div class="assistant-avatar" id="assistantAvatar">
        🤖
    </div>

    <div class="balance-card">
        <div>💰 موجودی حساب</div>
        <div class="balance-amount" id="totalBalance">۰ تومان</div>
        <div class="status-box" id="statusBox">
            <span id="statusText">برای شروع روی میکروفون کلیک کنید</span>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: #666; font-size: 12px;">
            💬 گفتگو با دستیار
        </div>
    </div>

    <div class="manual-section">
        <h3 style="margin-bottom: 15px; color: white;">📝 ثبت دستی</h3>
        <input type="text" id="descInput" placeholder="عنوان خرید">
        <input type="number" id="amountInput" placeholder="مبلغ (تومان)">
        <textarea id="noteInput" placeholder="توضیحات (اختیاری)" rows="2"></textarea>
        <button class="btn-add" onclick="addManualExpense()">➕ ثبت</button>
    </div>

    <h3 style="margin: 20px 0 10px; color: white;">📋 تاریخچه</h3>
    <ul class="history-list" id="historyList"></ul>

    <div class="mic-wrapper">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // داده‌ها
        let expenses = JSON.parse(localStorage.getItem('voiceFinanceDB')) || [];
        let convState = 'IDLE';
        let tempData = {};
        let recognition = null;
        let isListening = false;
        
        // تبدیل اعداد فارسی به انگلیسی
        function convertNumbers(str) {
            const persian = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            const arabic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            for(let i=0; i<10; i++) {
                str = str.replace(new RegExp(persian[i], 'g'), i);
                str = str.replace(new RegExp(arabic[i], 'g'), i);
            }
            return str;
        }
        
        function toPersian(num) {
            return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }
        
        function saveData() {
            localStorage.setItem('voiceFinanceDB', JSON.stringify(expenses));
            renderUI();
        }
        
        function addExpense(desc, amount, note = '') {
            if (!desc || isNaN(amount) || amount <= 0) return false;
            const now = new Date();
            expenses.unshift({
                desc, amount, note,
                date: now.toLocaleDateString('fa-IR'),
                time: now.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'})
            });
            saveData();
            return true;
        }
        
        function renderUI() {
            const total = expenses.reduce((sum, i) => sum + i.amount, 0);
            document.getElementById('totalBalance').innerText = toPersian(total.toLocaleString('fa-IR')) + ' تومان';
            
            const list = document.getElementById('historyList');
            if (expenses.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">هنوز خریدی ثبت نشده</div>';
                return;
            }
            
            list.innerHTML = expenses.map(item => `
                <li class="history-item">
                    <div class="item-header">
                        <span class="item-title">${item.desc}</span>
                        <span class="item-price">${toPersian(item.amount.toLocaleString('fa-IR'))} تومان</span>
                    </div>
                    ${item.note ? '<div style="color:#999;font-size:12px;">📝 ' + item.note + '</div>' : ''}
                    <div style="color:#666;font-size:11px;margin-top:5px;">${item.date} - ${item.time}</div>
                </li>
            `).join('');
        }
        
        // نمایش پیام در چت
        function addChatMessage(text, isUser = false) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message ' + (isUser ? 'user' : 'assistant');
            msgDiv.innerText = (isUser ? '👤 ' : '🤖 ') + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // تابع صحبت کردن - با چند روش
        function speak(text) {
            console.log('Speaking:', text);
            
            // نمایش در چت
            addChatMessage(text, false);
            
            // به‌روزرسانی وضعیت
            document.getElementById('statusText').innerText = text;
            
            // تلاش برای استفاده از speechSynthesis
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fa-IR';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                
                // انتخاب صدای مناسب
                const voices = window.speechSynthesis.getVoices();
                const persianVoice = voices.find(v => v.lang.includes('fa'));
                const arabicVoice = voices.find(v => v.lang.includes('ar'));
                
                if (persianVoice) {
                    utterance.voice = persianVoice;
                } else if (arabicVoice) {
                    utterance.voice = arabicVoice;
                }
                
                // انیمیشن صحبت
                document.getElementById('assistantAvatar').classList.add('speaking');
                
                utterance.onend = () => {
                    document.getElementById('assistantAvatar').classList.remove('speaking');
                };
                
                utterance.onerror = () => {
                    document.getElementById('assistantAvatar').classList.remove('speaking');
                    console.log('Speech error, trying without voice');
                    
                    // تلاش مجدد بدون صدای خاص
                    const retryUtterance = new SpeechSynthesisUtterance(text);
                    retryUtterance.lang = 'fa-IR';
                    retryUtterance.rate = 0.9;
                    window.speechSynthesis.speak(retryUtterance);
                };
                
                window.speechSynthesis.speak(utterance);
            } else {
                // اگر speechSynthesis پشتیبانی نمی‌شود
                document.getElementById('assistantAvatar').classList.remove('speaking');
            }
        }
        
        // تنظیم تشخیص صدا
        function setupRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRec) {
                showToast('مرورگر شما پشتیبانی نمی‌کند', 'error');
                return;
            }
            
            recognition = new SpeechRec();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('assistantAvatar').classList.add('listening');
                document.getElementById('statusText').innerText = '👂 گوش می‌دهم...';
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log('Heard:', transcript);
                
                // نمایش در چت
                addChatMessage(transcript, true);
                
                // پردازش دستور
                processCommand(transcript.trim().toLowerCase());
            };
            
            recognition.onerror = (event) => {
                console.log('Recognition error:', event.error);
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('assistantAvatar').classList.remove('listening');
                
                if (event.error === 'not-allowed') {
                    showToast('لطفاً دسترسی میکروفون را فعال کنید', 'error');
                } else if (event.error === 'no-speech') {
                    showToast('صدایی شنیده نشد', 'error');
                }
                
                document.getElementById('statusText').innerText = 'خطا! دوباره تلاش کنید';
            };
            
            recognition.onend = () => {
                console.log('Recognition ended, state:', convState);
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('assistantAvatar').classList.remove('listening');
                
                // اگر در حالت مکالمه هستیم، دوباره گوش بده
                if (convState !== 'IDLE' && convState !== 'FINISHED') {
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch(e) {
                            console.log('Restart error:', e);
                        }
                    }, 500);
                } else {
                    document.getElementById('statusText').innerText = 'آماده دستور جدید';
                }
            };
        }
        
        function toggleVoice() {
            if (!recognition) {
                setupRecognition();
            }
            
            if (isListening) {
                recognition.stop();
                convState = 'IDLE';
                document.getElementById('statusText').innerText = 'توقف شد';
            } else {
                window.speechSynthesis.cancel();
                convState = 'IDLE';
                try {
                    recognition.start();
                } catch(e) {
                    console.log('Start error:', e);
                }
            }
        }
        
        // پردازش دستورات
        function processCommand(cmd) {
            cmd = convertNumbers(cmd);
            console.log('Processing:', cmd);
            
            // مرحله ۱: پرسیدن نام کالا
            if (convState === 'ASK_DESC') {
                tempData.desc = cmd;
                convState = 'ASK_AMT';
                speak('چقدر پرداخت کردی؟');
                return;
            }
            
            // مرحله ۲: پرسیدن مبلغ
            if (convState === 'ASK_AMT') {
                const nums = cmd.match(/\d+/g);
                if (nums && nums.length > 0) {
                    let amount = parseInt(nums[nums.length - 1]);
                    
                    if (cmd.includes('هزار')) amount *= 1000;
                    if (cmd.includes('میلیون')) amount *= 1000000;
                    
                    tempData.amount = amount;
                    
                    if (addExpense(tempData.desc, amount)) {
                        speak(toPersian(amount.toLocaleString('fa-IR')) + ' تومان ثبت شد. توضیح داری؟');
                        convState = 'ASK_NOTE';
                    } else {
                        convState = 'IDLE';
                        speak('خطا در ثبت');
                    }
                } else {
                    speak('مبلغ را نفهمیدم. دوباره بگو');
                }
                return;
            }
            
            // مرحله ۳: پرسیدن توضیحات
            if (convState === 'ASK_NOTE') {
                if (cmd.includes('نه') || cmd.includes('ندارم') || cmd.length < 3) {
                    speak('باشه. دستور بعدی؟');
                } else {
                    expenses[0].note = cmd;
                    saveData();
                    speak('توضیح ثبت شد');
                }
                convState = 'IDLE';
                return;
            }
            
            // دستورات اصلی
            if (cmd.includes('گزارش') || cmd.includes('وضعیت')) {
                giveReport();
            } else if (cmd.includes('آخرین')) {
                if (expenses.length > 0) {
                    const e = expenses[0];
                    speak('آخرین خرید: ' + e.desc + ' ' + toPersian(e.amount.toLocaleString('fa-IR')) + ' تومان');
                } else {
                    speak('خریدی ثبت نشده');
                }
            } else if (cmd.includes('ثبت') || cmd.includes('خرید') || cmd.includes('هزینه')) {
                const nums = cmd.match(/\d+/g);
                if (nums && nums.length > 0) {
                    let amount = parseInt(nums[nums.length - 1]);
                    if (cmd.includes('هزار')) amount *= 1000;
                    
                    let desc = cmd.replace(/[0-9۰-۹]/g, '')
                        .replace(/هزار|میلیون|تومان|ثبت|خرید|هزینه/g, '')
                        .trim() || 'خرید';
                    
                    if (addExpense(desc, amount)) {
                        speak(toPersian(amount.toLocaleString('fa-IR')) + ' تومان بابت ' + desc + ' ثبت شد');
                    }
                } else {
                    convState = 'ASK_DESC';
                    speak('چی خریدی؟');
                }
            } else if (cmd.includes('سلام')) {
                speak('سلام! چطور می‌تونم کمکت کنم؟');
            } else if (cmd.includes('پاک')) {
                if (confirm('همه پاک شود؟')) {
                    expenses = [];
                    saveData();
                    speak('همه چیز پاک شد');
                }
            } else {
                speak('نفهمیدم. بگو: ثبت هزینه، گزارش، یا آخرین خرید');
            }
        }
        
        function giveReport() {
            if (expenses.length === 0) {
                speak('خریدی ثبت نشده');
                return;
            }
            
            const today = new Date().toLocaleDateString('fa-IR');
            const todayExp = expenses.filter(i => i.date === today);
            
            if (todayExp.length === 0) {
                speak('امروز خریدی نداشتی');
                return;
            }
            
            const total = todayExp.reduce((sum, i) => sum + i.amount, 0);
            let report = 'امروز ' + toPersian(todayExp.length) + ' خرید ثبت شده. جمع: ' + toPersian(total.toLocaleString('fa-IR')) + ' تومان. ';
            
            todayExp.slice(0, 3).forEach((e, i) => {
                report += toPersian(i + 1) + '. ' + e.desc + ' ' + toPersian(e.amount.toLocaleString('fa-IR')) + ' تومان. ';
            });
            
            speak(report);
        }
        
        function addManualExpense() {
            const desc = document.getElementById('descInput').value.trim();
            const amount = parseInt(document.getElementById('amountInput').value);
            const note = document.getElementById('noteInput').value.trim();
            
            if (addExpense(desc, amount, note)) {
                document.getElementById('descInput').value = '';
                document.getElementById('amountInput').value = '';
                document.getElementById('noteInput').value = '';
                speak('ثبت شد');
                showToast('✅ ثبت شد');
            } else {
                showToast('اطلاعات ناقص است', 'error');
            }
        }
        
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // راه‌اندازی
        renderUI();
        setupRecognition();
        
        // بارگذاری صداها
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }
        
        // تست صدا
        setTimeout(() => {
            console.log('Testing speech...');
            speak('سلام! من دستیار صوتی شما هستم');
        }, 1000);
    </script>
</body>
</html>
