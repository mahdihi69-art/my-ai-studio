<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #00d4ff; margin-bottom: 30px; font-size: 28px; }
    .card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
    textarea { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 12px; font-size: 15px; margin-bottom: 15px; resize: vertical; min-height: 100px; }
    textarea:focus { outline: none; border-color: #00d4ff; }
    button { background: linear-gradient(45deg, #00d4ff, #0066ff); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    button:disabled { background: #555; cursor: not-allowed; }
    .loading { display: none; text-align: center; padding: 20px; color: #00d4ff; }
    .result { display: none; background: rgba(0,255,136,0.1); border-right: 4px solid #00ff88; padding: 20px; border-radius: 12px; margin-top: 15px; line-height: 1.8; }
    .error { display: none; background: rgba(255,0,0,0.1); border-right: 4px solid #ff4444; padding: 15px; border-radius: 12px; margin-top: 15px; color: #ffaaaa; }
    .status { text-align: center; padding: 10px; background: rgba(255,193,7,0.1); border-radius: 10px; margin-bottom: 20px; color: #ffc107; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI Studio - آفلاین</h1>
    
    <div class="status" id="status">️ در حال بارگذاری مدل... (بار اول ۲-۳ دقیقه)</div>
    
    <div class="card">
      <textarea id="prompt" placeholder="سوال یا متن خود را اینجا بنویسید...&#10;&#10;مثال: یک داستان کوتاه درباره یک ربات شجاع بنویس"></textarea>
      <button id="btn" onclick="generate()" disabled>⏳ در حال آماده‌سازی...</button>
      
      <div class="loading" id="loading">
        <div style="border: 4px solid rgba(255,255,255,0.1); border-left-color: #00d4ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
        <p>در حال پردازش...</p>
      </div>
      
      <div class="error" id="error"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;

    async function init() {
      try {
        const status = document.getElementById('status');
        status.innerHTML = ' در حال دانلود مدل... (حدود ۲GB - صبر کنید)';
        
        engine = await CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC", {
          initProgressCallback: (progress) => {
            status.innerHTML = `⏳ ${progress.text}`;
          }
        });
        
        status.innerHTML = '✅ آماده! می‌توانید سوال بپرسید.';
        status.style.background = 'rgba(0,255,136,0.1)';
        status.style.color = '#00ff88';
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').innerHTML = '🚀 تولید پاسخ';
      } catch (err) {
        document.getElementById('status').innerHTML = '❌ خطا در بارگذاری مدل: ' + err.message;
        document.getElementById('status').style.background = 'rgba(255,0,0,0.1)';
        document.getElementById('status').style.color = '#ff4444';
      }
    }

    window.generate = async function() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) {
        alert('لطفاً متنی بنویسید!');
        return;
      }

      const btn = document.getElementById('btn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const result = document.getElementById('result');

      btn.disabled = true;
      loading.style.display = 'block';
      error.style.display = 'none';
      result.style.display = 'none';

      try {
        const reply = await engine.chat.completions.create({
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7,
          max_tokens: 500
        });

        loading.style.display = 'none';
        btn.disabled = false;
        result.style.display = 'block';
        result.innerHTML = '<strong>✨ پاسخ:</strong><br><br>' + reply.choices[0].message.content;
      } catch (err) {
        loading.style.display = 'none';
        btn.disabled = false;
        error.style.display = 'block';
        error.innerHTML = '❌ خطا: ' + err.message;
      }
    };

    // Initialize on load
    init();
  </script>
</body>
</html>
