plugins { id 'com.android.application' }

def avalaiKey = System.getenv("AVALAI_API_KEY") ?: ""
def escapedAvalaiKey = avalaiKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'com.mahdihi69.pouya'
    compileSdk 35
    defaultConfig {
        applicationId "com.mahdihi69.pouya"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.6'
        buildConfigField 'String', 'AVALAI_API_KEY', '\"' + escapedAvalaiKey + '\"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
