plugins { id 'com.android.application' }

def qwenKey = System.getenv("QWEN_API_KEY") ?: ""
def avalaiKey = System.getenv("AVALAI_API_KEY") ?: ""
def escapedQwenKey = qwenKey.replace("\\", "\\\\").replace(""", "\\"")
def escapedAvalaiKey = avalaiKey.replace("\\", "\\\\").replace(""", "\\"")

android {
    namespace 'com.mahdihi69.story'
    compileSdk 35
    defaultConfig {
        applicationId "com.mahdihi69.storymaker3"
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '1.8.3'
        buildConfigField 'String', 'QWEN_API_KEY', '\"' + escapedQwenKey + '\"'
        buildConfigField 'String', 'AVALAI_API_KEY', '\"' + escapedAvalaiKey + '\"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.7.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
