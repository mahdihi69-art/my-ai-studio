plugins { id 'com.android.application' }

def qwenKey = System.getenv("QWEN_API_KEY") ?: ""
def escapedQwenKey = qwenKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'com.mahdihi69.story'
    compileSdk 35
    defaultConfig {
        applicationId "com.mahdihi69.story"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'QWEN_API_KEY', '\"' + escapedQwenKey + '\"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
}
