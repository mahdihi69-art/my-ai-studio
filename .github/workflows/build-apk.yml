name: Build Story Maker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-story:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Story Maker
        run: gradle :story:assembleDebug --no-daemon --stacktrace

      - name: Verify Story Maker APK
        run: |
          set -euo pipefail
          APK="story/build/outputs/apk/debug/story-debug.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          BADGING=$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep "package: name='com.mahdihi69.storymaker'"
          echo "$BADGING" | grep "sdkVersion:'23'"
          echo "$BADGING" | grep "targetSdkVersion:'31'"
          if echo "$BADGING" | grep -q "testOnly='true'"; then
            echo "ERROR: testOnly=true"
            exit 1
          fi
          echo "STORY_APK_OK size=$(stat -c%s "$APK") bytes"

      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-apk
          path: story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error

      - name: Publish Story Maker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="story-v2.8.${{ github.run_number }}"
          gh release create "$TAG" story/build/outputs/apk/debug/story-debug.apk             --title "داستان‌ساز $TAG" --generate-notes
