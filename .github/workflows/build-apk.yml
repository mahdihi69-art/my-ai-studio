name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gemini secret is available
        run: |
          test -n "$GEMINI_API_KEY"
          echo "Gemini API key is available to the build"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Validate APK before upload
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test -n "$(unzip -p "$APK" classes*.dex 2>/dev/null | strings | grep -m1 'MainActivity' || true)"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          fi
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -20
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pouya-finance-debug-apk-v1.2
          path: app/build/outputs/apk/debug/app-debug.apk
