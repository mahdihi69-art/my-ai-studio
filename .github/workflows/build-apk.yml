name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify existing Pouya secret
        run: test -n "$GEMINI_API_KEY"

      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon

      - name: Validate APKs
        run: |
          set -e
          for APK in app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk; do
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            sha256sum "$APK"
            ls -lh "$APK"
          done

      - name: Upload Pouya APK
        uses: actions/upload-artifact@v4
        with:
          name: pouya-finance-debug-apk-v2
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-debug-apk-v2
          path: story/build/outputs/apk/debug/story-debug.apk
