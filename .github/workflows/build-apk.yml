name: Build Story Maker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: story-maker-release
  cancel-in-progress: false

jobs:
  build-story:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: story-maker-debug-signing-key-v1

      - name: Require the previously saved signing key
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::The stable signing key cache is missing. Refusing to create a different key because that would break app updates."
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Story Maker
        run: gradle :story:assembleDebug --no-daemon --stacktrace

      - name: Verify Story Maker APK
        shell: bash
        run: |
          set -euo pipefail
          APK="story/build/outputs/apk/debug/story-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          grep -Fq "package: name='com.mahdihi69.storymaker.online'" <<< "$BADGING"
          grep -Fq "sdkVersion:'23'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'31'" <<< "$BADGING"
          grep -Fq "versionCode='${GITHUB_RUN_NUMBER}'" <<< "$BADGING"
          if grep -q "testOnly='true'" <<< "$BADGING"; then
            echo "ERROR: testOnly=true"
            exit 1
          fi
          unzip -l "$APK" | grep -Eq 'classes([0-9]+)?\.dex'
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 25000 ]; then
            echo "ERROR: APK unexpectedly small ($SIZE bytes)"
            exit 1
          fi
          echo "STORY_APK_OK size=$SIZE bytes"

      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-apk
          path: story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Story Maker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="story-online-v3.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" story/build/outputs/apk/debug/story-debug.apk --title "داستان‌ساز آنلاین $TAG" --generate-notes
