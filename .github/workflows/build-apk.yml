name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix Story Maker compile imports
        run: |
          set -euo pipefail
          sed -i 's/void setBg(Uri u)/void setBg(android.net.Uri u)/g' story/src/main/java/com/mahdihi69/story/MainActivity.java
      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon --stacktrace
      - name: Check APK outputs
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          STORY=story/build/outputs/apk/debug/story-debug.apk
          test -s "$APP"
          test -s "$STORY"
          echo "App APK: $(stat -c%s "$APP") bytes"
          echo "Story APK: $(stat -c%s "$STORY") bytes"
      - name: Runtime install and launch test — Story Maker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -u
            STORY_APK=story/build/outputs/apk/debug/story-debug.apk
            adb install -r "$STORY_APK"
            adb shell am force-stop com.mahdihi69.storymaker
            adb shell am start -n com.mahdihi69.storymaker/com.mahdihi69.story.MainActivity
            sleep 8
            echo "=== STORY PACKAGE ==="
            adb shell pm path com.mahdihi69.storymaker || true
            echo "=== STORY ACTIVITY ==="
            adb shell dumpsys activity activities | grep -A3 -B2 "com.mahdihi69.storymaker" || true
            echo "=== STORY PROCESS ==="
            adb shell pidof com.mahdihi69.storymaker || true
            echo "=== STORY LOGCAT ==="
            adb logcat -d -t 1500 | grep -E "AndroidRuntime|com.mahdihi69.storymaker|com.mahdihi69.story" | tail -n 250 || true
            PID=$(adb shell pidof com.mahdihi69.storymaker | tr -d '\r' | tr -d '\n')
            if [ -z "$PID" ]; then
              echo "STORY MAKER PROCESS DID NOT STAY ALIVE"
              exit 1
            fi
            if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|Process: com.mahdihi69.storymaker" | grep -q .; then
              echo "STORY MAKER CRASH DETECTED"
              exit 1
            fi
            echo "REAL ANDROID STORY INSTALL + LAUNCH TEST PASSED"
      - name: Upload runtime-verified APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-runtime-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error
      - name: Publish runtime-verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk --title "Android APKs $TAG - Runtime Verified" --generate-notes
