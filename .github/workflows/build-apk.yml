name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Story Maker neural voice engine
        shell: bash
        run: |
          set -e
          mkdir -p story/libs story/src/main/assets/tts
          curl -L --fail --retry 3 -o story/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          for MODEL in \
            vits-piper-fa_IR-amir-medium \
            vits-piper-fa_IR-ganji_adabi-medium \
            vits-piper-fa_IR-gyro-medium \
            vits-piper-fa_IR-reza_ibrahim-medium; do
            curl -L --fail --retry 3 -o /tmp/$MODEL.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL.tar.bz2
            tar -xjf /tmp/$MODEL.tar.bz2 -C story/src/main/assets/tts
            rm -f /tmp/$MODEL.tar.bz2
          done
          find story/src/main/assets/tts -maxdepth 2 -type f | head -50
          du -sh story/src/main/assets/tts
          ls -lh story/libs/sherpa-onnx-1.13.7.aar

      - name: Verify existing Pouya secret
        run: test -n "$GEMINI_API_KEY"

      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon

      - name: Validate APKs
        run: |
          set -e
          for APK in app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk; do
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            sha256sum "$APK"
            ls -lh "$APK"
          done

      - name: Upload Pouya APK
        uses: actions/upload-artifact@v4
        with:
          name: pouya-finance-debug-apk-v2
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-debug-apk-v3-neural-persian-tts
          path: story/build/outputs/apk/debug/story-debug.apk

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v1.2.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            story/build/outputs/apk/debug/story-debug.apk \
            --title "Android APKs $TAG" \
            --generate-notes
