name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix Story Maker compile imports
        run: |
          set -euo pipefail
          sed -i 's/void setBg(Uri u)/void setBg(android.net.Uri u)/g' story/src/main/java/com/mahdihi69/story/MainActivity.java
      - name: Build all APKs
        run: gradle :app:assembleDebug :story:assembleDebug :builder:assembleDebug --no-daemon --stacktrace
      - name: Check APK outputs
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          STORY=story/build/outputs/apk/debug/story-debug.apk
          BUILDER=builder/build/outputs/apk/debug/builder-debug.apk
          test -s "$APP"
          test -s "$STORY"
          test -s "$BUILDER"
          echo "App APK: $(stat -c%s "$APP") bytes"
          echo "Story APK: $(stat -c%s "$STORY") bytes"
          echo "Builder APK: $(stat -c%s "$BUILDER") bytes"
      - name: Runtime install and launch test — Story Maker + Program Builder
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r "$PWD/story/build/outputs/apk/debug/story-debug.apk"
            adb install -r "$PWD/builder/build/outputs/apk/debug/builder-debug.apk"

            adb logcat -c
            adb shell am force-stop com.mahdihi69.storymaker
            adb shell monkey -p com.mahdihi69.storymaker 1 >/dev/null 2>&1
            sleep 8

            echo "=== STORY PACKAGE ==="
            adb shell pm path com.mahdihi69.storymaker
            echo "=== STORY ACTIVITY ==="
            adb shell dumpsys activity activities | grep -A3 -B2 "com.mahdihi69.storymaker" || true
            echo "=== STORY PROCESS ==="
            PID=$(adb shell pidof com.mahdihi69.storymaker | tr -d '\r' | tr -d '\n')
            echo "Story PID=$PID"
            test -n "$PID"
            if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|Process: com.mahdihi69.storymaker" | grep -q .; then echo "STORY MAKER CRASH DETECTED"; exit 1; fi

            adb shell am force-stop com.mahdihi69.builder
            adb shell monkey -p com.mahdihi69.builder 1 >/dev/null 2>&1
            sleep 5
            BPID=$(adb shell pidof com.mahdihi69.builder | tr -d '\r' | tr -d '\n')
            echo "Builder PID=$BPID"
            test -n "$BPID"
            if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|Process: com.mahdihi69.builder" | grep -q .; then echo "PROGRAM BUILDER CRASH DETECTED"; exit 1; fi

            echo "REAL ANDROID STORY + PROGRAM BUILDER INSTALL AND LAUNCH TEST PASSED"
      - name: Upload runtime-verified APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-runtime-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
            builder/build/outputs/apk/debug/builder-debug.apk
          if-no-files-found: error
      - name: Publish runtime-verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk --title "Android APKs $TAG - Runtime Verified" --generate-notes
