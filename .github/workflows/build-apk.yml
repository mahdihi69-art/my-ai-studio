name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all APKs
        run: gradle :app:assembleDebug :story:assembleDebug :builder:assembleDebug --no-daemon --stacktrace

      - name: Check APK outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s story/build/outputs/apk/debug/story-debug.apk
          test -s builder/build/outputs/apk/debug/builder-debug.apk

      - name: Runtime install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r "$PWD/story/build/outputs/apk/debug/story-debug.apk"
            adb install -r "$PWD/builder/build/outputs/apk/debug/builder-debug.apk"
            adb logcat -c

            adb shell am force-stop com.mahdihi69.storymaker
            adb shell am start -n com.mahdihi69.storymaker/com.mahdihi69.story.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.mahdihi69.storymaker/com.mahdihi69.story.MainActivity"
            STORY_PID=$(adb shell pidof com.mahdihi69.storymaker | tr -d '\r' || true)
            test -n "$STORY_PID"
            adb logcat -d -t 1500 > /tmp/story-log.txt
            ! grep -E "FATAL EXCEPTION|Process: com.mahdihi69.storymaker" /tmp/story-log.txt >/dev/null 2>&1

            adb shell am force-stop com.mahdihi69.builder
            adb shell am start -n com.mahdihi69.builder/com.mahdihi69.builder.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.mahdihi69.builder/com.mahdihi69.builder.MainActivity"
            BUILDER_PID=$(adb shell pidof com.mahdihi69.builder | tr -d '\r' || true)
            test -n "$BUILDER_PID"
            adb logcat -d -t 1500 > /tmp/builder-log.txt
            ! grep -E "FATAL EXCEPTION|Process: com.mahdihi69.builder" /tmp/builder-log.txt >/dev/null 2>&1

            echo "REAL ANDROID STORY + PROGRAM BUILDER INSTALL AND LAUNCH TEST PASSED"

      - name: Upload runtime-verified APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-runtime-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
            builder/build/outputs/apk/debug/builder-debug.apk
          if-no-files-found: error

      - name: Publish runtime-verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk --title "Android APKs $TAG - Runtime Verified" --generate-notes
