name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix Story Maker compile imports
        run: |
          set -euo pipefail
          sed -i 's/void setBg(Uri u)/void setBg(android.net.Uri u)/g' story/src/main/java/com/mahdihi69/story/MainActivity.java
      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon --stacktrace
      - name: Check APK outputs
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          STORY=story/build/outputs/apk/debug/story-debug.apk
          test -s "$APP"
          test -s "$STORY"
          echo "App APK: $(stat -c%s "$APP") bytes"
          echo "Story APK: $(stat -c%s "$STORY") bytes"
      - name: Runtime install and launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r story/build/outputs/apk/debug/story-debug.apk

            adb shell am force-stop com.mahdihi69.pouya
            adb shell monkey -p com.mahdihi69.pouya 1
            sleep 5
            adb shell pidof com.mahdihi69.pouya >/dev/null

            adb shell am force-stop com.mahdihi69.storymaker
            adb shell monkey -p com.mahdihi69.storymaker 1
            sleep 5
            adb shell pidof com.mahdihi69.storymaker >/dev/null

            if adb logcat -d -t 1000 | grep -q "FATAL EXCEPTION: main"; then
              adb logcat -d -t 1000
              exit 1
            fi
            echo "REAL ANDROID INSTALL + LAUNCH TEST PASSED"
      - name: Upload runtime-verified APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-runtime-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error
      - name: Publish runtime-verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk --title "Android APKs $TAG - Runtime Verified" --generate-notes
