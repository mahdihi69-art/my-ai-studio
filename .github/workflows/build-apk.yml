name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix Story Maker compile imports
        run: |
          set -euo pipefail
          sed -i 's/void setBg(Uri u)/void setBg(android.net.Uri u)/g' story/src/main/java/com/mahdihi69/story/MainActivity.java
      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon --stacktrace
      - name: Validate APKs strictly
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          STORY=story/build/outputs/apk/debug/story-debug.apk
          test -s "$APP"
          test -s "$STORY"
          test "$(stat -c%s "$APP")" -gt 100000
          test "$(stat -c%s "$STORY")" -gt 50000
          unzip -t "$APP" >/dev/null
          unzip -t "$STORY" >/dev/null
          unzip -l "$APP" | grep -q 'AndroidManifest.xml'
          unzip -l "$APP" | grep -q 'classes.dex'
          unzip -l "$STORY" | grep -q 'AndroidManifest.xml'
          unzip -l "$STORY" | grep -q 'classes.dex'
          unzip -l "$STORY" | grep -q 'classes2.dex'
          echo '--- APK sizes ---'
          ls -lh "$APP" "$STORY"
          echo '--- APK hashes ---'
          sha256sum "$APP" "$STORY"
          echo '--- Story APK contents ---'
          unzip -l "$STORY"
      - name: Runtime smoke test Story Maker on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install -r story/build/outputs/apk/debug/story-debug.apk
            adb shell am force-stop com.mahdihi69.storymaker3
            adb shell monkey -p com.mahdihi69.storymaker3 1
            sleep 5
            if adb shell pidof com.mahdihi69.storymaker3 >/dev/null 2>&1; then
              echo "Story Maker launched successfully"
            else
              echo "Story Maker process is not running"
              adb logcat -d -t 500
              exit 1
            fi
            adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|com.mahdihi69.storymaker3" | tail -80 || true

      - name: Upload Pouya APK
        uses: actions/upload-artifact@v4
        with:
          name: pouya-finance-debug-apk-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-debug-apk-verified
          path: story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error
      - name: Publish verified public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            story/build/outputs/apk/debug/story-debug.apk \
            --title "Android APKs $TAG - AI Voice Edition" \
            --generate-notes
