name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all APKs
        run: gradle :app:assembleDebug :story:assembleDebug :builder:assembleDebug --no-daemon --stacktrace

      - name: Verify APK files
        run: |
          set -euo pipefail
          for f in app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk; do
            test -s "$f"
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Verify Story Maker APK signing and manifest
        run: |
          set -euo pipefail
          STORY="story/build/outputs/apk/debug/story-debug.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$STORY"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$STORY" | grep -E "package:|sdkVersion|targetSdkVersion"

      - name: Test Story Maker on Android 12 (API 31)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -e
            STORY="story/build/outputs/apk/debug/story-debug.apk"
            adb install -r "$STORY"
            adb shell pm path com.mahdihi69.storymaker
            adb shell am start -W -n com.mahdihi69.storymaker/com.mahdihi69.story.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -q "com.mahdihi69.story/com.mahdihi69.story.MainActivity"
            echo "STORY_ANDROID12_INSTALL_AND_LAUNCH_OK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-v3
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
            builder/build/outputs/apk/debug/builder-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.2.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk --title "Android APKs $TAG" --generate-notes
