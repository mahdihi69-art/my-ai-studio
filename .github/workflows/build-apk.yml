name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all APKs
        run: gradle :app:assembleDebug :story:assembleDebug :builder:assembleDebug --no-daemon --stacktrace

      - name: Verify APKs for broad Android compatibility
        run: |
          set -euo pipefail
          for f in app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk; do
            test -s "$f"
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$f"
            echo "VERIFIED: $f ($(stat -c%s "$f") bytes)"
          done
          echo "Story manifest:"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging story/build/outputs/apk/debug/story-debug.apk | grep -E "package:|sdkVersion|targetSdkVersion"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-final
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
            builder/build/outputs/apk/debug/builder-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.3.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk --title "Android APKs $TAG" --generate-notes
