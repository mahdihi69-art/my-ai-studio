name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix Story Maker compile imports
        run: |
          set -euo pipefail
          sed -i 's/void setBg(Uri u)/void setBg(android.net.Uri u)/g' story/src/main/java/com/mahdihi69/story/MainActivity.java
      - name: Build both APKs
        run: gradle :app:assembleDebug :story:assembleDebug --no-daemon --stacktrace
      - name: Validate APKs strictly
        run: |
          set -euo pipefail
          for APK in app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk; do
            test -s "$APK"
            if [[ "$APK" == app/* ]]; then
              test "$(stat -c%s "$APK")" -gt 100000
            else
              test "$(stat -c%s "$APK")" -gt 10000
            fi
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" | grep -q 'AndroidManifest.xml'
            unzip -l "$APK" | grep -q 'classes.dex'
            echo "VERIFIED APK: $APK"
            sha256sum "$APK"
            ls -lh "$APK"
          done
      - name: Upload Pouya APK
        uses: actions/upload-artifact@v4
        with:
          name: pouya-finance-debug-apk-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Story Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-debug-apk-verified
          path: story/build/outputs/apk/debug/story-debug.apk
          if-no-files-found: error
      - name: Publish verified public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            story/build/outputs/apk/debug/story-debug.apk \
            --title "Android APKs $TAG - AI Voice Edition" \
            --generate-notes
