name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all APKs
        run: gradle :app:assembleDebug :story:assembleDebug :builder:assembleDebug --no-daemon --stacktrace

      - name: Check APK outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s story/build/outputs/apk/debug/story-debug.apk
          test -s builder/build/outputs/apk/debug/builder-debug.apk

      - name: Runtime install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: false
          script: |
            set -e
            adb install -r "$PWD/story/build/outputs/apk/debug/story-debug.apk"
            adb install -r "$PWD/builder/build/outputs/apk/debug/builder-debug.apk"

            adb logcat -c
            adb shell am force-stop com.mahdihi69.storymaker
            adb shell am start -n com.mahdihi69.storymaker/com.mahdihi69.story.MainActivity
            sleep 8
            adb logcat -d -t 3000 > /tmp/story-log.txt
            echo "=== STORY TOP ACTIVITY ==="
            adb shell dumpsys activity activities | grep -A5 -B3 "com.mahdihi69.storymaker" || true
            echo "=== STORY PROCESS ==="
            adb shell pidof com.mahdihi69.storymaker || true
            echo "=== STORY CRASH LOG ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.mahdihi69.storymaker|Force finishing" /tmp/story-log.txt || true
            STORY_PID=$(adb shell pidof com.mahdihi69.storymaker | tr -d '\r' || true)
            test -n "$STORY_PID"
            STORY_CRASH=$(grep -E "FATAL EXCEPTION|Process: com.mahdihi69.storymaker|Force finishing" /tmp/story-log.txt || true)
            test -z "$STORY_CRASH"

            adb logcat -c
            adb shell am force-stop com.mahdihi69.builder
            adb shell am start -n com.mahdihi69.builder/com.mahdihi69.builder.MainActivity
            sleep 8
            adb logcat -d -t 3000 > /tmp/builder-log.txt
            echo "=== BUILDER TOP ACTIVITY ==="
            adb shell dumpsys activity activities | grep -A5 -B3 "com.mahdihi69.builder" || true
            echo "=== BUILDER PROCESS ==="
            adb shell pidof com.mahdihi69.builder || true
            echo "=== BUILDER CRASH LOG ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.mahdihi69.builder|Force finishing" /tmp/builder-log.txt || true
            BUILDER_PID=$(adb shell pidof com.mahdihi69.builder | tr -d '\r' || true)
            test -n "$BUILDER_PID"
            BUILDER_CRASH=$(grep -E "FATAL EXCEPTION|Process: com.mahdihi69.builder|Force finishing" /tmp/builder-log.txt || true)
            test -z "$BUILDER_CRASH"

            echo "REAL ANDROID STORY + PROGRAM BUILDER INSTALL AND LAUNCH TEST PASSED"

      - name: Upload runtime-verified APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-runtime-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            story/build/outputs/apk/debug/story-debug.apk
            builder/build/outputs/apk/debug/builder-debug.apk
          if-no-files-found: error

      - name: Publish runtime-verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk story/build/outputs/apk/debug/story-debug.apk builder/build/outputs/apk/debug/builder-debug.apk --title "Android APKs $TAG - Runtime Verified" --generate-notes
