name: Story Maker - Public APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-story:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Persian neural voice engine
        shell: bash
        run: |
          set -e
          mkdir -p story/libs story/src/main/assets/tts
          curl -L --fail --retry 3 -o story/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          for MODEL in \
            vits-piper-fa_IR-amir-medium \
            vits-piper-fa_IR-ganji_adabi-medium \
            vits-piper-fa_IR-gyro-medium \
            vits-piper-fa_IR-reza_ibrahim-medium; do
            curl -L --fail --retry 3 -o /tmp/$MODEL.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL.tar.bz2
            tar -xjf /tmp/$MODEL.tar.bz2 -C story/src/main/assets/tts
            rm -f /tmp/$MODEL.tar.bz2
          done
          du -sh story/src/main/assets/tts

      - name: Build Story Maker APK
        run: gradle :story:assembleDebug --no-daemon

      - name: Validate APK
        run: |
          set -e
          APK=story/build/outputs/apk/debug/story-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Story Maker artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-public-apk
          path: story/build/outputs/apk/debug/story-debug.apk
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="story-v1.2.${{ github.run_number }}"
          gh release create "$TAG" \
            story/build/outputs/apk/debug/story-debug.apk \
            --title "داستان‌ساز $TAG" \
            --generate-notes
