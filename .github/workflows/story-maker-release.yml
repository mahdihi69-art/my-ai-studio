name: Story Maker - Public APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-story:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build lightweight Story Maker APK
        run: gradle :story:assembleDebug --no-daemon

      - name: Validate APK
        run: |
          set -e
          APK=story/build/outputs/apk/debug/story-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Story Maker artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-maker-online-test-apk
          path: story/build/outputs/apk/debug/story-debug.apk
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="story-test-v1.3.${{ github.run_number }}"
          gh release create "$TAG" \
            story/build/outputs/apk/debug/story-debug.apk \
            --title "داستان‌ساز $TAG - نسخه آزمایشی سبک" \
            --generate-notes
